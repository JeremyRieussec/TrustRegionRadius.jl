name: Documentation

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

jobs:
  build:
    permissions:
      contents: write
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Instantiate docs environment
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path = pwd()))
            Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN:   ${{ secrets.GITHUB_TOKEN }}   # pull-request previews
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }} # pushing to gh-pages
        run: julia --project=docs docs/make.jl
